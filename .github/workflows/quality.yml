name: Frontend and full-stack quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CI: true
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: divysharma7/laif-api
          ref: main
          path: laif-api
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            laif-api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: laif-api
      - run: npm run security:secrets
        working-directory: laif-api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fullstack
      - name: Upload full-stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report/full-stack
            test-results/full-stack
